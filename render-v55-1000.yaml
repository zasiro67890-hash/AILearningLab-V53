services:
  - type: worker
    name: v55-chromium-us01
    runtime: docker
    region: virginia
    plan: 1c-2g
    numInstances: 100
    dockerfilePath: ./Dockerfile.v55-render
    envVars:
      - key: BRAIN_URL
        value: https://ailearninglab-v53.onrender.com
      - key: WORKER_REGION
        value: US
      - key: TRAIN_STEPS
        value: "10000"
      - key: CHROMIUM_HEADLESS
        value: "1"
      - key: RUN_ONE_SESSION
        value: "0"
      - key: BRAIN_RELAY_URL
        value: https://v53-us-relay.onrender.com
      - key: BRAIN_RELAY_API_KEY
        sync: false
